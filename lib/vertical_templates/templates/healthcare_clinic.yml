labels:
  - title: novo-contato
    color: '#94A3B8'
    description: Mensagem recebida, ainda não triada
  - title: triagem
    color: '#94A3B8'
    description: Identificando o motivo do contato
  - title: em-atendimento
    color: '#14B8A6'
    description: Atendente conduzindo a conversa
  - title: agendado
    color: '#14B8A6'
    description: Consulta reservada, aguardando confirmação do paciente
  - title: confirmado
    color: '#14B8A6'
    description: Paciente confirmou presença
  - title: lembrete-enviado
    color: '#14B8A6'
    description: Lembrete de 48h, 24h ou 2h enviado
  - title: lista-espera
    color: '#14B8A6'
    description: Paciente aguardando uma vaga
  - title: reagendado
    color: '#F97316'
    description: Paciente pediu uma nova data
  - title: cancelado
    color: '#EF4444'
    description: Paciente desistiu da consulta
  - title: nao-compareceu
    color: '#EF4444'
    description: Paciente faltou sem avisar
  - title: escalado
    color: '#EF4444'
    description: Caso encaminhado à coordenação clínica
  - title: atendimento-encerrado
    color: '#94A3B8'
    description: Consulta concluída
  - title: lembrete-retorno
    color: '#14B8A6'
    description: Lembrete de retorno ou acompanhamento enviado
  - title: ficou-inativo
    color: '#94A3B8'
    description: Sem resposta ao lembrete de retorno

custom_attribute_definitions:
  - attribute_key: especialidade
    attribute_display_name: Especialidade
    attribute_model: conversation_attribute
    attribute_display_type: list
    attribute_values: [Clínico geral, Pediatria, Odontologia, Dermatologia, Psicologia, Outro]
    attribute_description: Especialidade procurada pelo paciente
  - attribute_key: profissional
    attribute_display_name: Profissional
    attribute_model: conversation_attribute
    attribute_display_type: text
    attribute_description: Profissional responsável pelo atendimento
  - attribute_key: data_consulta
    attribute_display_name: Data da consulta
    attribute_model: conversation_attribute
    attribute_display_type: date
    attribute_description: Data e hora reservadas para a consulta
  - attribute_key: convenio
    attribute_display_name: Convênio
    attribute_model: conversation_attribute
    attribute_display_type: text
    attribute_description: Plano de saúde informado, ou particular

automation_rules:
  - name: Novo contato recebido
    description: Aplica a label de entrada em toda conversa nova
    event_name: conversation_created
    conditions: []
    actions:
      - action_name: add_label
        action_params: [novo-contato]
  - name: Atendimento encerrado
    description: Troca a label de em-atendimento pela de encerrado quando a conversa é resolvida
    event_name: conversation_resolved
    conditions: []
    actions:
      - action_name: add_label
        action_params: [atendimento-encerrado]
      - action_name: remove_label
        action_params: [em-atendimento]
