name: UniverZAP CI

on:
  push:
    branches: [main, develop, 'univerzap/**']
  pull_request:
    branches: [main, develop]
  # Manual re-run. A GitHub Actions outage once left a commit with no run at
  # all — the push webhook never fired — and with only push triggers the sole
  # way to test it again was to invent a new commit.
  workflow_dispatch:

concurrency:
  group: univerzap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint-ruby:
    name: Lint Ruby (RuboCop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop --parallel --format progress

  lint-frontend:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm eslint

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest
        run: pnpm run test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

  backend-tests:
    name: Backend specs (rspec)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [8]
        ci_node_index: [0, 1, 2, 3, 4, 5, 6, 7]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      # Strip enterprise code — same approach as run_foss_spec.yml. The
      # enterprise tree needs licensed dependencies we don't ship here.
      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Create database
        run: bundle exec rake db:create

      - name: Load schema (OSS baseline)
        run: bundle exec rake db:schema:load

      # Apply UniverZAP-only migrations. db/schema.rb tracks the upstream
      # Chatwoot snapshot (version 2026_05_07_000000); every funnels /
      # kanban / Athenas / univercart migration we ship after that needs
      # to be replayed on top so rspec stops with PendingMigrationError
      # otherwise. Running `db:migrate` is a no-op when the schema is
      # already current — safe to keep here permanently.
      - name: Apply pending UniverZAP migrations
        run: bundle exec rake db:migrate

      # Round-robin spec distribution across the matrix. Slow specs get
      # spread evenly instead of all landing on one node.
      - name: Run backend tests (parallelized)
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          # SimpleCov is gated on this env so local rspec runs stay
          # fast; CI always exports coverage so we can upload the
          # report as an artifact for inspection.
          COVERAGE: 'true'
        run: |
          SPEC_FILES=($(find spec -name '*_spec.rb' | sort))
          TESTS=""
          for i in "${!SPEC_FILES[@]}"; do
            if [ $(( i % ${{ matrix.ci_node_total }} )) -eq ${{ matrix.ci_node_index }} ]; then
              TESTS="$TESTS ${SPEC_FILES[$i]}"
            fi
          done
          if [ -n "$TESTS" ]; then
            bundle exec rspec --profile=10 --format progress --format json --out tmp/rspec_results.json $TESTS
          fi

      - name: Upload rspec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-results-${{ matrix.ci_node_index }}
          path: tmp/rspec_results.json
          if-no-files-found: ignore

      # include-hidden-files é obrigatório aqui e não é preferência.
      #
      # A partir da v4.4 o upload-artifact ignora arquivo que começa com ponto,
      # e o SimpleCov grava justamente em coverage/.resultset.json. Sem esta
      # linha o artefato sobe com o HTML bonitinho e SEM o único arquivo que
      # permite somar os 8 shards, então ninguém nunca viu o número real de
      # cobertura deste repositório e nada avisou.
      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.ci_node_index }}
          path: coverage/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload rails log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rails-log-${{ matrix.ci_node_index }}
          path: log

  # Cobertura do código que é NOSSO, somando os 8 shards.
  #
  # Precisa ser um job separado porque cada shard roda um oitavo dos specs e
  # portanto enxerga um oitavo do código exercitado: um mínimo aplicado dentro
  # do shard reprovaria por arquivo que outro shard cobriu inteiro.
  #
  # E mede só os módulos que este projeto criou. Um percentual único deste
  # repositório mede sobretudo o Chatwoot, que a gente não escreveu, e sobe ou
  # desce por decisão de outra gente.
  coverage-gate:
    name: Coverage gate (código UniverZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
      # Sem bundler-cache: o portão usa só json e yaml da stdlib, então
      # instalar o Gemfile inteiro aqui seriam minutos gastos para nada.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-*
          path: coverage_shards
      - name: Measure and gate
        run: ruby bin/coverage_gate.rb coverage_shards
      - name: Upload collated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-collated
          path: coverage_shards
          include-hidden-files: true
          if-no-files-found: ignore

  # Aggregator job — gives branch protection one stable required-check
  # name regardless of how many matrix shards backend-tests fans into.
  ci-pass:
    name: CI pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-ruby, lint-frontend, frontend-tests, backend-tests]
    if: always()
    steps:
      # coverage-gate ainda NÃO entra nesta lista, de propósito.
      #
      # A lógica dele tem spec própria rodando dentro de backend-tests, então
      # um erro de cálculo já reprova aqui. O que ainda não rodou nenhuma vez é
      # o encanamento: baixar oito artefatos e achar os resultsets dentro
      # deles. Segurar o deploy de três features na estreia de um encanamento
      # que ninguém viu funcionar seria trocar um risco real por um risco
      # inventado.
      #
      # Promover assim que a primeira execução sair verde: acrescentar
      # coverage-gate ao `needs` e ao `if` abaixo, e declarar os pisos medidos
      # em config/coverage_floors.yml.
      - name: Ensure all required jobs succeeded
        run: |
          if [ "${{ needs.lint-ruby.result }}" != "success" ] || \
             [ "${{ needs.lint-frontend.result }}" != "success" ] || \
             [ "${{ needs.frontend-tests.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            echo "lint-ruby:      ${{ needs.lint-ruby.result }}"
            echo "lint-frontend:  ${{ needs.lint-frontend.result }}"
            echo "frontend-tests: ${{ needs.frontend-tests.result }}"
            echo "backend-tests:  ${{ needs.backend-tests.result }}"
            exit 1
          fi
          echo "All required jobs succeeded."

  build-and-push:
    name: Build & publish Docker image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only push to the registry on real branch pushes — not PRs from forks
    # — and only after the lint + test gate passes. PRs from forks build
    # via the existing `test_docker_build.yml` workflow without pushing.
    needs: [ci-pass]
    if: github.event_name == 'push' && needs.ci-pass.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eukennedy/univerzap
          # Force a lowercase owner — ghcr.io rejects uppercase namespaces.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/univerzap/phase-0-saneamento' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - uses: docker/setup-buildx-action@v3

      - name: Build & push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
