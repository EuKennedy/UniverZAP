name: Lighthouse CI

# Runs against the staging deploy after every successful main / staging
# build so we catch performance regressions before they reach the
# operator. Budgets live in `.lighthouserc.json` next to this file.
#
# Manual dispatch supported: open Actions → Lighthouse CI → Run workflow
# and pick a target URL.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Public URL to audit (defaults to staging /status page).'
        required: false
        default: 'https://app.univerzap.cloud/status'
  workflow_run:
    workflows: ['UniverZAP CI']
    branches: ['univerzap/phase-0-saneamento', 'main']
    types: [completed]

permissions:
  contents: read

jobs:
  audit:
    name: Lighthouse audit
    # Don't audit when the upstream CI run failed — no point burning
    # minutes on a known-broken commit.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Lighthouse CLI
        run: npm install -g @lhci/cli@0.13.x lighthouse@12.x

      - name: Run Lighthouse against staging
        run: |
          TARGET="${{ github.event.inputs.target_url }}"
          if [ -z "$TARGET" ]; then
            TARGET="https://app.univerzap.cloud/status"
          fi
          echo "Auditing $TARGET"
          lighthouse "$TARGET" \
            --output=json \
            --output=html \
            --output-path=./lighthouse \
            --chrome-flags="--headless --no-sandbox --disable-gpu"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            lighthouse.report.html
            lighthouse.report.json
          if-no-files-found: warn
