# ─────────────────────────────────────────────────────────────────────────────
# UniverZAP — production compose for Coolify
# ─────────────────────────────────────────────────────────────────────────────
# Coolify auto-detects this file when "Docker Compose" build pack is selected.
#
# IMPORTANT: only `rails` declares a `build:` block. `sidekiq` reuses the
# image produced by the rails build via `image:` + `depends_on`. We avoid
# YAML anchors / hidden service stubs because Coolify treats every top-level
# entry under `services:` as a real service and would spawn redundant builds.
#
# Public domain wiring uses Coolify's magic FQDN variables:
#   SERVICE_FQDN_RAILS_3000  → primary app domain (Traefik + auto-TLS)
# Set it in Coolify → Application → Environment to `staging.univerzap.cloud`.
# ─────────────────────────────────────────────────────────────────────────────

services:
  rails:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: univerzap/univerzap:latest
    env_file: .env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - SERVICE_FQDN_RAILS_3000
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    expose:
      - '3000'
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - coolify.managed=true
      - coolify.type=application
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  sidekiq:
    image: univerzap/univerzap:latest
    env_file: .env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    volumes:
      - storage_data:/app/storage
    depends_on:
      rails:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bundle exec sidekiqmon processes | grep -q 'sidekiq'"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-univerzap_production}
      - POSTGRES_USER=${POSTGRES_USERNAME:-univerzap}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME:-univerzap} -d ${POSTGRES_DATABASE:-univerzap_production}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    env_file: .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  storage_data:
  postgres_data:
  redis_data:
