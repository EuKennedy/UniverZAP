services:
  rails:
    image: ghcr.io/eukennedy/univerzap:staging
    pull_policy: always
    env_file: .env
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    expose:
      - "3000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    # Liveness: se o Puma responde, da para rotear. `start_period` cobre o boot
    # do Rails, durante o qual falhar e esperado e nao deve contar como doente.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Tempo para terminar as requisicoes em voo antes do SIGKILL.
    stop_grace_period: 30s

  sidekiq:
    image: ghcr.io/eukennedy/univerzap:staging
    pull_policy: always
    env_file: .env
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - storage_data:/app/storage
    depends_on:
      - rails
      - postgres
      - redis
    restart: unless-stopped
    # O config/sidekiq.yml pede 60s para drenar, e explica por que: abaixo
    # disso um job longo (download de midia + gatilho do Athenas + criacao de
    # contato) era SIGKILLado no meio da transacao e a mensagem recebida do
    # WhatsApp se perdia. Sem este valor aqui, o Docker mata muito antes e o
    # pedido daquele arquivo nunca foi atendido. 90s da folga sobre os 60s.
    stop_grace_period: 90s
    # Desliga o HEALTHCHECK que vem na imagem: ele bate em localhost:3000, e
    # este container nao sobe servidor web. Quem reporta a saude do Sidekiq e o
    # /health/sidekiq do rails, que le o estado pelo Redis.
    healthcheck:
      disable: true

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-univerzap_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-univerzap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    env_file: .env
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
