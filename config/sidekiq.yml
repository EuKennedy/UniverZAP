# Sample configuration file for Sidekiq.
# Options here can still be overridden by cmd line args.
# Place this file at config/sidekiq.yml and Sidekiq will
# pick it up automatically.
---
:verbose: false
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 10) %>
# 60s shutdown drain lets long-running incoming-message jobs commit
# their DB transaction before Sidekiq hard-kills them. The previous
# 25s window matched Coolify's default grace period exactly, so any
# job that needed >25s (media download + Athenas autopilot trigger
# + contact creation) was SIGKILLed mid-transaction and the inbound
# WhatsApp message was lost. Pair with Coolify `stop_grace_period`
# (set to 70s or higher in the service spec) for a clean handover.
:timeout: <%= ENV.fetch("SIDEKIQ_SHUTDOWN_TIMEOUT", 60).to_i %>
:max_retries: 3

# Sidekiq will run this file through ERB when reading it so you can
# even put in dynamic logic, like a host-specific queue.
# http://www.mikeperham.com/2013/11/13/advanced-sidekiq-host-specific-queues/
# https://github.com/sidekiq/sidekiq/wiki/Advanced-Options
# Since queues are declared without waits, the jobs in lower ranking queues will only be processed
# if there are no jobs in higher ranking queues.
:queues:
  - critical
  - high
  # Athenas autopilot turns. Below :high so a message a human agent typed is
  # always delivered first, above :medium so a customer-facing AI reply never
  # waits behind bulk imports/exports.
  # NOTE: a single sidekiq process drains this whole list in strict priority
  # order, so its own lane buys visibility (queue depth/latency per feature) and
  # the option to split it into a dedicated process later — it does NOT isolate
  # the thread pool today. A burst of AI turns still occupies the shared
  # concurrency and delays the lanes below it.
  - ai_replies
  - medium
  - default
  - mailers
  - action_mailbox_routing
  - low
  - scheduled_jobs
  - deferred
  - purgable
  - housekeeping
  - async_database_migration
  - bulk_reindex_low
  - active_storage_analysis
  - active_storage_purge
  - action_mailbox_incineration

# you can override concurrency based on environment
production:
  :concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 10) %>
staging:
  :concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY", 10) %>
